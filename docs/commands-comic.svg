<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 634" width="960" height="634" role="img" aria-labelledby="t d">
<title id="t">The commands of orchestration-kit, one picture each</title>
<desc id="d">Set up: start opens a fresh master in Orca from any other terminal; prepare gets a project folder ready, known to Orca and carrying the worker's rules. Run work: dispatch sends one contract through the gate and starts its worker; watch is the alarm clock that wakes the master when Orca does not, and only reads. Look: status says where each job stands and what it waits for, and only reads; report counts the tokens each job used against its budget. Recover: resume wakes a worker whose agent ended before it reported; override-hold lifts, on the owner's word, the hold a refused worker left behind. Hand over: succeed checks the handoff note and calls in a successor; inherit is the successor signing in, and PASS closes the old terminal.</desc>
<style>
:root{--bg:#fff;--panel:#f6f8fa;--box:#fff;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--kit:#0969da;--kit-soft:#ddf4ff;--ok:#1a7f37;--ok-soft:#dafbe1;--stop:#cf222e;--warn:#9a6700;--warn-soft:#fff8c5;--guard:#8c959f;--hat:#eac54f;--wb:#d0d7de}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#151b23;--box:#0d1117;--line:#3d444d;--ink:#f0f6fc;--muted:#9198a1;--kit:#1f6feb;--kit-soft:#111d2e;--ok:#238636;--ok-soft:#12261e;--stop:#f85149;--warn:#d29922;--warn-soft:#272115;--guard:#656c76;--hat:#bb8009;--wb:#3d444d}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--muted)}
.h{font-size:20px;font-weight:700;fill:var(--ink)}
.t{font-size:14.5px;font-weight:600;fill:var(--ink)}
.say{font-size:13px;fill:var(--ink)}
