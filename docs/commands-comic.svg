<rect class="bg" width="960" height="634" rx="8"/>
<text class="h" x="20" y="44">The commands, one picture each</text>
<text x="20" y="66">The ten commands of the wrapper, in the order a master meets them.</text>

<text class="t" x="20" y="130">Set up</text>
<text x="20" y="148">before the first worker</text>
<g transform="translate(170 84)">
<rect class="pp" width="380" height="98" rx="10"/>
<rect class="panel" x="10" y="10" width="92" height="78" rx="8"/>
<rect class="pp" x="26" y="20" width="60" height="58" rx="5"/><path class="ln thin" d="M26 31H86"/><use href="#master" transform="translate(56 76) scale(.42)"/>
<text class="t m" x="116" y="36">start</text>
<text x="116" y="58">Open a fresh master in Orca,</text>
<text x="116" y="75">from any other terminal.</text>
</g>
<g transform="translate(560 84)">
<rect class="pp" width="380" height="98" rx="10"/>
<rect class="panel" x="10" y="10" width="92" height="78" rx="8"/>
<path class="bk" d="M22 34h18l6 7h26v32h-50z"/><rect class="note" x="56" y="50" width="32" height="26" rx="3"/><path class="ln thin" d="M62 59H82M62 66H76"/>
<text class="t m" x="116" y="36">prepare</text>
<text x="116" y="58">Get a project folder ready: known</text>
<text x="116" y="75">to Orca, with the worker's rules.</text>
</g>
<text class="t" x="20" y="238">Run work</text>
<text x="20" y="256">one worker per contract</text>
<g transform="translate(170 192)">
<rect class="pp" width="380" height="98" rx="10"/>
<rect class="panel" x="10" y="10" width="92" height="78" rx="8"/>
<use href="#paper" transform="translate(32 50) scale(.72)"/><path class="go2" d="M48 50H60"/><rect class="gb" x="66" y="44" width="8" height="32" rx="2"/><g transform="rotate(-42 70 47)"><rect class="pp" x="69" y="43" width="30" height="8" rx="4"/></g>
<text class="t m" x="116" y="36">dispatch</text>
<text x="116" y="58">Send one contract through the gate</text>
<text x="116" y="75">and start its worker.</text>
</g>
<g transform="translate(560 192)">
<rect class="pp" width="380" height="98" rx="10"/>
<rect class="panel" x="10" y="10" width="92" height="78" rx="8"/>
<use href="#clock" transform="translate(56 80) scale(1.5)"/><path class="ln thin" d="M27 36l-7 -6M85 36l7 -6"/>
<text class="t m" x="116" y="36">watch</text>
<text x="116" y="58">The alarm clock: wakes the master</text>
<text x="116" y="75">when Orca does not. Only reads.</text>
</g>
<text class="t" x="20" y="346">Look</text>
<text x="20" y="364">where things stand</text>
<g transform="translate(170 300)">
<rect class="pp" width="380" height="98" rx="10"/>
<rect class="panel" x="10" y="10" width="92" height="78" rx="8"/>
<circle class="okf" cx="28" cy="30" r="4.5"/><path class="sk" d="M40 30H72"/><circle class="wf" cx="28" cy="48" r="4.5"/><path class="sk" d="M40 48H62"/><circle class="dot" cx="28" cy="66" r="4.5"/><path class="sk" d="M40 66H56"/><circle class="ln" cx="76" cy="56" r="11"/><path class="arm" d="M84 65L93 76"/>
<text class="t m" x="116" y="36">status</text>
<text x="116" y="58">Where does each job stand, and</text>
<text x="116" y="75">what is it waiting for? Only reads.</text>
</g>
<g transform="translate(560 300)">
<rect class="pp" width="380" height="98" rx="10"/>
<rect class="panel" x="10" y="10" width="92" height="78" rx="8"/>
<use href="#book" x="40" y="74"/><rect class="kf" x="66" y="54" width="8" height="20" rx="1.5"/><rect class="kf" x="78" y="40" width="8" height="34" rx="1.5"/><rect class="kf" x="90" y="60" width="8" height="14" rx="1.5"/><path class="cut" d="M62 48H100" style="stroke-width:1.5;stroke-dasharray:3 3"/>
<text class="t m" x="116" y="36">report</text>
<text x="116" y="58">Count the tokens each job used,</text>
<text x="116" y="75">against its budget.</text>
</g>
<text class="t" x="20" y="454">Recover</text>
<text x="20" y="472">when a worker is stuck</text>
<g transform="translate(170 408)">
<rect class="pp" width="380" height="98" rx="10"/>
<rect class="panel" x="10" y="10" width="92" height="78" rx="8"/>
<use href="#worker" transform="translate(40 80) scale(.55)"/><text class="zz" x="18" y="32" style="font-size:11px">z z</text><path class="kf" d="M72 38l20 12l-20 12z"/>
<text class="t m" x="116" y="36">resume</text>
<text x="116" y="58">Wake a worker whose agent ended</text>
<text x="116" y="75">before it reported.</text>
</g>
<g transform="translate(560 408)">
<rect class="pp" width="380" height="98" rx="10"/>
<rect class="panel" x="10" y="10" width="92" height="78" rx="8"/>
<use href="#owner" transform="translate(30 80) scale(.55)"/><rect class="note" x="52" y="34" width="44" height="20" rx="3"/><text class="holdt" x="74" y="48" text-anchor="middle" style="font-size:9.5px">HOLD</text><path class="cut" d="M50 56L98 32"/>
<text class="t m" x="116" y="36">override-hold</text>
<text x="116" y="58">On the owner's word, lift the hold</text>
<text x="116" y="75">a refused worker left behind.</text>
</g>
<text class="t" x="20" y="562">Hand over</text>
<text x="20" y="580">master to successor</text>
<g transform="translate(170 516)">
<rect class="pp" width="380" height="98" rx="10"/>
<rect class="panel" x="10" y="10" width="92" height="78" rx="8"/>
<use href="#master" transform="translate(30 78) scale(.42)"/><use href="#paper" transform="translate(60 52) scale(.62)"/><path class="go2" d="M74 52H94"/>
<text class="t m" x="116" y="36">succeed</text>
<text x="116" y="58">Check the handoff note and call</text>
<text x="116" y="75">in a successor.</text>
</g>
<g transform="translate(560 516)">
<rect class="pp" width="380" height="98" rx="10"/>
<rect class="panel" x="10" y="10" width="92" height="78" rx="8"/>
<use href="#master" transform="translate(32 78) scale(.42)"/><use href="#book" transform="translate(78 78) scale(.7)"/><g transform="translate(74 38) rotate(-10)"><rect class="stamp" x="-20" y="-9" width="40" height="18" rx="4"/><text class="stampt mini" x="0" y="3.5" text-anchor="middle">PASS</text></g>
<text class="t m" x="116" y="36">inherit</text>
<text x="116" y="58">The successor signs in. PASS</text>
<text x="116" y="75">closes the old terminal.</text>
</g>
</svg>
