<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="t d">
<title id="t">Who does what in orchestration-kit</title>
<desc id="d">A map that moves. The owner asks the master and the master reports back. The blue area is what the plugin adds: the dispatch gate with its ledger, the review that reads every result, and the harness, the rules for workers. Orca is the workshop: each worker sits in a terminal of its own, with the rules on its wall. A contract travels from the master to the gate, is stamped ALLOW, and goes on into Orca, where a worker starts. The worker's report, worker_done, travels back as Orca mail and wakes the master; the watch wakes it when that mail does not arrive.</desc>
<style>
:root{--bg:#fff;--panel:#f6f8fa;--box:#fff;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--kit:#0969da;--kit-soft:#ddf4ff;--ok:#1a7f37;--ok-soft:#dafbe1;--stop:#cf222e;--warn:#9a6700;--warn-soft:#fff8c5;--guard:#8c959f;--hat:#eac54f;--wb:#d0d7de}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#151b23;--box:#0d1117;--line:#3d444d;--ink:#f0f6fc;--muted:#9198a1;--kit:#1f6feb;--kit-soft:#111d2e;--ok:#238636;--ok-soft:#12261e;--stop:#f85149;--warn:#d29922;--warn-soft:#272115;--guard:#656c76;--hat:#bb8009;--wb:#3d444d}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12.5px;fill:var(--muted)}
.h{font-size:20px;font-weight:700;fill:var(--ink)}
.t{font-size:14.5px;font-weight:600;fill:var(--ink)}
.say{font-size:13px;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.k{fill:var(--kit);font-weight:600}
.num{font-size:13px;font-weight:700;fill:var(--bg)}
.sm{font-size:11px}
.cap2{font-size:10.5px;font-weight:700;letter-spacing:1.2px;fill:var(--ink)}
.tiny{font-size:10px;font-weight:600;fill:var(--warn)}
.stampt{font-size:11px;font-weight:700;letter-spacing:.8px;fill:var(--ok)}
.bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--line)}
.gr{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round}
.sk{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round}
.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1.5}
.arm{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.face{fill:var(--box);stroke:var(--ink);stroke-width:2}
.eye,.hair{fill:var(--ink)}
.kf{fill:var(--kit)}
.kb{fill:var(--kit);stroke:var(--ink);stroke-width:2}
.gb{fill:var(--guard);stroke:var(--ink);stroke-width:2}
.wbd{fill:var(--wb);stroke:var(--ink);stroke-width:2}
.ob{fill:var(--ok);stroke:var(--ink);stroke-width:2}
.hatc{fill:var(--hat);stroke:var(--ink);stroke-width:2}
.pp{fill:var(--box);stroke:var(--ink);stroke-width:1.75}
.bk{fill:var(--kit-soft);stroke:var(--ink);stroke-width:1.75}
.bub{fill:var(--box);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.dot{fill:var(--line)}
.note{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.5}
.stripe{fill:none;stroke:var(--stop);stroke-width:8}
.stamp{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.okc{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2.5}
.chk{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.wc{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2.5}
.loop{fill:none;stroke:var(--warn);stroke-width:3;stroke-linecap:round;marker-end:url(#lp)}
.lph{fill:var(--warn)}
.low{fill:var(--stop)}
.go{fill:none;stroke:var(--kit);stroke-width:2;stroke-linecap:round;marker-end:url(#go)}
.goh{fill:var(--kit)}
:root{--stop-soft:#ffebe9}
@media (prefers-color-scheme:dark){:root{--stop-soft:#25171c}}
.kitp{fill:var(--kit-soft);stroke:var(--kit)}
.stampx{fill:var(--stop-soft);stroke:var(--stop);stroke-width:2}
.stopt{font-size:11px;font-weight:700;letter-spacing:.8px;fill:var(--stop)}
.holdt{font-size:11px;font-weight:700;letter-spacing:1px;fill:var(--warn)}
.mini{font-size:8.5px;font-weight:700;letter-spacing:.6px}
.zz{font-size:13px;font-weight:700;fill:var(--muted)}
.badr{fill:var(--stop)}
.bada{fill:var(--warn)}
.okf{fill:var(--ok)}
.wf{fill:var(--warn)}
.cut{fill:none;stroke:var(--stop);stroke-width:3;stroke-linecap:round}
.go2{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;marker-end:url(#g2)}
.g2h{fill:var(--muted)}
.flow{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-dasharray:5 7;marker-end:url(#g2);animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-12}}
/* one loop of 12 s: a contract goes out through the gate, a report comes back as mail */
.an{animation:12s infinite both}
#ovp{opacity:0;animation-name:ovp}
#ovs{animation-name:ovs}
#ovl{fill:var(--stop);animation-name:ovl}
#ovb{transform-origin:446px 226px;animation-name:ovb}
#ovw{animation-name:ovw}
#ove{opacity:0;animation-name:ove;animation-timing-function:linear}
@keyframes ovp{0%,4%{opacity:0;transform:translate(268px,232px) scale(.4)}8%,12%{opacity:1;transform:translate(268px,232px) scale(1)}24%,40%{opacity:1;transform:translate(424px,232px) scale(1)}54%{opacity:1;transform:translate(690px,232px) scale(1)}58%,100%{opacity:0;transform:translate(700px,232px) scale(.6)}}
@keyframes ovs{0%,26%{opacity:0;transform:rotate(-14deg) scale(2.2)}30%,100%{opacity:1;transform:rotate(-14deg) scale(1)}}
@keyframes ovl{0%,29%{fill:var(--stop)}31%,58%{fill:var(--ok)}60%,100%{fill:var(--stop)}}
@keyframes ovb{0%,32%{transform:rotate(0deg)}38%,56%{transform:rotate(-62deg)}62%,100%{transform:rotate(0deg)}}
@keyframes ovw{0%,58%,62%,66%,70%,100%{transform:translateY(0)}60%,64%,68%{transform:translateY(-5px)}}
@keyframes ove{0%,72%{opacity:0;transform:translate(686px,262px)}74%{opacity:1;transform:translate(686px,262px)}79%{opacity:1;transform:translate(686px,352px)}84%{opacity:1;transform:translate(686px,452px)}94%{opacity:1;transform:translate(230px,452px)}98%{opacity:1;transform:translate(230px,324px)}100%{opacity:0;transform:translate(230px,318px)}}
@media (prefers-reduced-motion:reduce){.an,.flow{animation:none!important}}
</style>
<defs>
<marker id="g2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="g2h" d="M0 0L10 5L0 10z"/></marker>
<marker id="lp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path class="lph" d="M0 0L10 5L0 10z"/></marker>
<marker id="go" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="goh" d="M0 0L10 5L0 10z"/></marker>
<!-- the cast: each stands on its own origin -->
