</g>
<g id="clock">
<path class="ln" d="M-9 -3L-12 0M9 -3L12 0"/>
<circle class="hatc" cx="-9" cy="-26" r="4"/>
<circle class="hatc" cx="9" cy="-26" r="4"/>
<circle class="pp" cx="0" cy="-14" r="12"/>
<path class="ln thin" d="M0 -14V-21M0 -14H5"/>
</g>
</defs>

<rect class="bg" width="960" height="490" rx="8"/>
<text class="h" x="20" y="44">Who does what</text>
<text x="20" y="66">The blue area is what this plugin adds. Orca keeps the workers and carries their mail.</text>

<!-- the two areas -->
<rect class="kitp" x="330" y="84" width="280" height="336" rx="12"/>
<text class="t" x="346" y="110">orchestration-kit</text>
<text x="346" y="128">what this plugin adds</text>
<rect class="panel" x="650" y="84" width="290" height="336" rx="12"/>
<text class="t" x="666" y="110">Orca</text>
<text x="666" y="128">the workshop: terminals and mail</text>
<path class="gr" d="M20 280H316M346 280H594"/>

<!-- you and the master -->
<use href="#owner" x="70" y="280"/>
<use href="#master" x="230" y="280"/>
<use href="#clock" x="290" y="280"/>
<text x="70" y="300" text-anchor="middle">Owner</text>
<text x="230" y="300" text-anchor="middle">Master</text>
<text class="m" x="291" y="300" text-anchor="middle">watch</text>
<path class="flow" d="M98 232H196"/>
<text x="147" y="224" text-anchor="middle">asks</text>
<path class="flow" d="M196 256H98"/>
<text x="147" y="272" text-anchor="middle">reports</text>

<!-- the gate and its logbook -->
<use href="#guard" x="392" y="280"/>
<rect class="gb" x="440" y="224" width="12" height="56" rx="3"/>
<circle id="ovl" class="an" cx="446" cy="213" r="7"/>
<circle class="ln thin" cx="446" cy="213" r="7"/>
<g id="ovb" class="an">
<rect class="pp" x="444" y="221" width="92" height="10" rx="5"/>
<path class="stripe" d="M464 222v8M484 222v8M504 222v8M524 222v8"/>
</g>
<use href="#book" x="572" y="280"/>
<text x="412" y="300" text-anchor="middle">dispatch gate</text>
<text x="572" y="300" text-anchor="middle">ledger</text>
<circle class="ln" cx="362" cy="340" r="8"/>
<path class="arm" d="M368 346L375 354"/>
<text x="392" y="346"><tspan class="m k">review</tspan> reads every result</text>
<rect class="note" x="351" y="376" width="24" height="20" rx="3"/>
<path class="ln thin" d="M356 383H370M356 389H365"/>
<text x="392" y="391"><tspan class="m k">harness</tspan> rules for workers</text>

<!-- Orca's rooms, a worker in each -->
<rect class="pp" x="666" y="146" width="126" height="134" rx="8"/>
<path class="ln thin" d="M666 164H792"/>
<circle class="dot" cx="678" cy="155" r="3"/>
<circle class="dot" cx="688" cy="155" r="3"/>
<circle class="dot" cx="698" cy="155" r="3"/>
<rect class="note" x="750" y="172" width="34" height="24" rx="3"/>
<text class="tiny" x="767" y="188" text-anchor="middle">rules</text>
<g id="ovw" class="an"><use href="#worker" x="722" y="278"/></g>
<rect class="pp" x="802" y="146" width="126" height="134" rx="8"/>
<path class="ln thin" d="M802 164H928"/>
<circle class="dot" cx="814" cy="155" r="3"/>
<circle class="dot" cx="824" cy="155" r="3"/>
<circle class="dot" cx="834" cy="155" r="3"/>
<rect class="note" x="886" y="172" width="34" height="24" rx="3"/>
<text class="tiny" x="903" y="188" text-anchor="middle">rules</text>
<use href="#worker" x="858" y="278"/>
<text x="729" y="300" text-anchor="middle">worker</text>
<text x="865" y="300" text-anchor="middle">worker</text>
<use href="#mail" x="686" y="352"/>
<text x="712" y="349"><tspan class="m k">worker_done</tspan></text>
<text x="712" y="366">the report, sent as Orca mail</text>

<!-- the routes -->
<path class="flow" d="M258 240H360"/>
<text x="296" y="204" text-anchor="middle">contract</text>
<path class="flow" d="M462 244H660"/>
<text x="630" y="236" text-anchor="middle">start</text>
<path class="flow" d="M686 368V452H230V312"/>
<text x="458" y="436" text-anchor="middle">the report wakes the master</text>
<text x="458" y="478" text-anchor="middle"><tspan class="m">watch</tspan> wakes it when Orca's mail does not arrive</text>

<!-- what moves -->
<g id="ovp" class="an">
<use href="#paper"/>
<g id="ovs" class="an">
<rect class="stamp" x="-26" y="-10" width="52" height="20" rx="4"/>
<text class="stampt" x="0" y="4" text-anchor="middle">ALLOW</text>
</g>
</g>
<g id="ove" class="an"><use href="#mail"/></g>
</svg>
